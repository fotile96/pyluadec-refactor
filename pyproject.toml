[project]
name = "pyluadec"
version = "0.1.0"
description = "Width-parameterized Lua 5.1 bytecode ingest layer and decompiler toolchain"
authors = [
    { name = "fotile96", email = "fotile13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pybind11>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.3.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# CI backstop, not a primary defense: a hang (e.g. a structuring recognizer
# that fails to advance pc and spins forever) surfaces in CI as a job that
# never returns -- no failure name, no diff, easy to mistake for flakiness
# and re-run.
#
# Sizing (re-measured 2026-08-12 on macOS arm64, 512 tests, corpus present):
# the full suite is ~40s wall clock and the slowest SINGLE test is
# tests/test_ledger_ratchet.py::test_ledger_is_a_reproducible_fixed_point at
# 12.0s, followed by tests/test_behaviour_probe.py's corpus fixture at 10.0s --
# both re-run the whole corpus pipeline, ~1478 luac_sz4 subprocesses each. So
# 60s is ~5x headroom on THIS platform, but CLAUDE.md documents the primary environment
# as a 32-bit i686 userland under WSL2, where subprocess spawn is materially
# slower; 60s is plausibly reachable there for the ratchet test alone, and a
# timeout that fires presents as exactly the ambiguous "hang" this setting
# exists to disambiguate. The ratchet test therefore carries its own
# @pytest.mark.timeout(300) so this global value can stay tight for
# everything else. Keep it tight: if a new test needs more, mark the test.
timeout = 60
